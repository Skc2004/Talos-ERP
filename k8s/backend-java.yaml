apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-java
  namespace: talos-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-java
  template:
    metadata:
      labels:
        app: backend-java
    spec:
      containers:
      - name: backend-java
        image: myrepo/inventory-maintainer:latest
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SUPABASE_DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: SUPABASE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SUPABASE_JWT_SECRET
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SUPABASE_URL
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SUPABASE_SERVICE_ROLE_KEY
        - name: CORS_ALLOWED_ORIGINS
          value: "http://frontend:80,http://localhost:5173"
        - name: PYTHON_GATEWAY_URL
          value: "http://backend-python:8000"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:29092"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-java
  namespace: talos-erp
spec:
  selector:
    app: backend-java
  ports:
  - port: 8080
    targetPort: 8080
