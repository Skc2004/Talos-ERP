apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: talos-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: myrepo/warehouse-frontend:latest
        env:
        - name: VITE_JAVA_API_URL
          value: "http://api.talos-erp.internal/v1"
        - name: VITE_PYTHON_API_URL
          value: "http://ai.talos-erp.internal"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: talos-erp
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
